<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAVEBIC 개인비서 V5</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px;
  background:#f4f7fb;
  font-family:Arial,"Malgun Gothic",sans-serif;
  color:#111827;
}
.page{
  max-width:780px;
  margin:0 auto;
  background:#fff;
  border:1px solid #d6e2f2;
  border-radius:28px;
  padding:22px 20px 26px;
  box-shadow:0 8px 24px rgba(15,23,42,.08);
}
.title-wrap{
  margin-bottom:22px;
}
.title-box{
  width:100%;
  border:1px solid #9fc3ff;
  border-radius:22px;
  padding:22px 12px;
  text-align:center;
  font-size:34px;
  font-weight:900;
  letter-spacing:.5px;
  color:#153b73;
  background:#eaf4ff;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-bottom:14px;
}
.field{
  border:1px solid #d1d5db;
  border-radius:22px;
  min-height:76px;
  padding:14px 16px;
  font-size:17px;
  font-weight:800;
  background:#fffdf5;
}
.field input{
  display:block;
  width:100%;
  border:1px solid #d6d3c2;
  border-radius:14px;
  outline:none;
  background:#fffefb;
  margin-top:8px;
  padding:12px;
  font-size:16px;
}
.fixed-line{
  display:flex;
  align-items:center;
  gap:9px;
  margin:4px 0 18px 4px;
  font-size:16px;
  cursor:pointer;
  user-select:none;
}
.round-check{
  width:23px;
  height:23px;
  border:2px solid #a8b5c7;
  border-radius:8px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  cursor:pointer;
  transition:.18s;
  flex-shrink:0;
}
.round-check.active{
  background:#60a5fa;
  border-color:#2563eb;
  box-shadow:0 0 0 4px rgba(96,165,250,.18);
}
.round-check.active::after{
  content:"✓";
  color:#fff;
  font-weight:900;
  font-size:14px;
}
.lookup-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin:8px 0 20px;
}
.lookup-btn{
  border:1px solid #c6d6ee;
  border-radius:18px;
  background:#f8fbff;
  min-height:50px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  color:#143d7a;
}
.my-history{
  display:none;
  border:1px solid #c6d6ee;
  border-radius:18px;
  background:#f8fbff;
  padding:14px;
  margin-bottom:20px;
  font-size:14px;
  line-height:1.55;
}
.history-title{
  font-weight:900;
  margin-bottom:8px;
}
.history-item{
  background:#fff;
  border:1px solid #dbe5f2;
  border-radius:14px;
  padding:10px;
  margin-top:8px;
}
.schedule{
  border:1px solid #d1d5db;
  border-radius:22px;
  min-height:76px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
  background:#fff;
}
.category-area{
  margin:22px 0 24px;
  padding:18px 14px;
  border:1px solid #e0e7f2;
  border-radius:24px;
  background:#ffffff;
}
.cat-row{
  display:grid;
  grid-template-columns:80px 1fr;
  align-items:center;
  margin-bottom:15px;
}
.cat-row:last-child{margin-bottom:0}
.cat-title{
  font-weight:900;
  font-size:15px;
  color:#111827;
}
.cat-options{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.option{
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  user-select:none;
  font-size:14px;
  min-width:78px;
}
.option .label{white-space:nowrap}
.note-title{
  font-size:19px;
  font-weight:900;
  margin:8px 0 8px;
}

.note-detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}
.note-detail-field{
  font-size:14px;
  font-weight:900;
  color:#111827;
}
.note-detail-field input{
  width:100%;
  border:1px solid #d6d3c2;
  border-radius:14px;
  outline:none;
  background:#fffefb;
  margin-top:6px;
  padding:11px;
  font-size:15px;
}
.note-guide{
  font-size:13px;
  color:#64748b;
  margin:0 0 8px;
  line-height:1.45;
}
@media(max-width:700px){
  .note-detail-grid{grid-template-columns:1fr;gap:9px}
}

.note-box{
  border:1px solid #d1d5db;
  border-radius:24px;
  min-height:165px;
  padding:16px;
  margin-bottom:24px;
  background:#fffdf5;
}
.note-box textarea{
  width:100%;
  min-height:82px;
  border:1px solid #d6d3c2;
  border-radius:16px;
  outline:none;
  resize:vertical;
  font-size:16px;
  padding:12px;
  background:#fffefb;
}
.store-history{
  margin-top:10px;
  padding:10px;
  border:1px solid #dbe5f2;
  border-radius:14px;
  background:#f8fbff;
  font-size:14px;
  color:#334155;
  line-height:1.55;
}
.upload-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-bottom:8px;
}
.upload-box{
  border:1px solid #c6d6ee;
  border-radius:22px;
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
  background:#fff;
}
.upload-box.upload{background:#f3fff6;color:#136f35}
.upload-box.camera{background:#f2f7ff;color:#1d4ed8}
.upload-help{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  font-size:13px;
  color:#64748b;
  text-align:center;
  margin-bottom:14px;
}
.file-list{margin:8px 0 18px}
.file-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:9px 11px;
  margin-top:7px;
  border:1px solid #dbe5f2;
  background:#f8fbff;
  border-radius:14px;
  font-size:14px;
}
.file-item button{
  border:none;
  background:#e5e7eb;
  border-radius:8px;
  padding:6px 9px;
  cursor:pointer;
}

.no-doc-line{
  display:flex;
  align-items:center;
  gap:9px;
  margin:10px 0 18px 4px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  user-select:none;
  color:#111827;
}
.no-doc-line .round-check{
  width:24px;
  height:24px;
}

.submit-btn{
  width:100%;
  min-height:66px;
  border:none;
  border-radius:22px;
  background:#2563eb;
  color:white;
  font-size:25px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(37,99,235,.24);
}
.lookup-btn:hover,.schedule:hover,.upload-box:hover{
  filter:brightness(.98);
}
.submit-btn:hover{background:#1d4ed8}
.result{
  display:none;
  margin-top:14px;
  padding:13px;
  border:1px solid #16a34a;
  border-radius:16px;
  background:#dcfce7;
  font-size:15px;
  line-height:1.65;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:99;
}
.modal-card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:18px;
  padding:22px;
}
.modal-card h3{margin-top:0}
.modal-card input{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  margin-bottom:10px;
  font-size:16px;
}
.modal-card button{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:900;
}
.primary{background:#111827;color:white}
.secondary{background:#e5e7eb;color:#111827}
@media(max-width:700px){
  body{padding:8px}
  .page{padding:14px 12px 20px;border-radius:22px}
  .title-box{font-size:27px;padding:20px 8px}
  .row,.upload-row,.upload-help,.lookup-row{grid-template-columns:1fr;gap:12px}
  .cat-row{grid-template-columns:62px 1fr;margin-bottom:13px}
  .cat-options{gap:10px}
  .option{font-size:13px;min-width:68px}
}

/* RAVEBIC_CORRECTION_INBOX_V1 */
.correction-panel{display:none;border:2px solid #fecaca;background:#fff7f7;border-radius:18px;padding:14px;margin:0 0 20px;font-size:14px;line-height:1.55}
.correction-panel .history-title{color:#991b1b;font-size:16px}
.correction-item{background:#fff;border:1px solid #fecaca;border-radius:14px;padding:12px;margin-top:10px}
.correction-msg{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px;margin:8px 0;color:#7c2d12}
.correction-upload{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.correction-upload input{display:block;width:100%;max-width:260px}
.correction-upload button{border:none;background:#ef4444;color:#fff;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}
.correction-done{background:#ecfdf5;border-color:#86efac;color:#166534}

/* RAVEBIC_CORRECTION_RED_ALERT_V2 */
#correctionAlertBtn.correction-alert-active{
  background:#ef4444 !important;
  color:#fff !important;
  border:1px solid #dc2626 !important;
  box-shadow:0 0 0 4px rgba(239,68,68,.14), 0 8px 18px rgba(239,68,68,.22) !important;
  animation:ravebicAlertPulse 1.2s infinite;
}
@keyframes ravebicAlertPulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.015)}
  100%{transform:scale(1)}
}
</style>

<body>
<div class="page">
  <div class="title-wrap">
    <div class="title-box">RAVEBIC 개인비서</div>

  <div class="row">

    <div class="cat-row">
      <div class="cat-title">브랜드</div>
      <div class="cat-options" id="brandGroup">

        <div class="option" onclick="selectOne('brand','세븐일레븐',this)"><span class="round-check"></span><span class="label">세븐</span></div>
        <div class="option" onclick="selectOne('brand','기타',this)"><span class="round-check"></span><span class="label">기타</span></div>
      </div>
    </div>

    <div class="cat-row">
      <div class="cat-title">업무</div>
      <div class="cat-options" id="workTypeGroup">

        <div class="option" onclick="selectOne('workType','인수실사',this)"><span class="round-check"></span><span class="label">인수</span></div>
        <div class="option" onclick="selectOne('workType','양수도',this)"><span class="round-check"></span><span class="label">양수도</span></div>
        <div class="option" onclick="selectOne('workType','폐점',this)"><span class="round-check"></span><span class="label">폐점</span></div>
      </div>
    </div>
  </div>

  <div class="note-title">점포특이사항 기재:</div>

    <div class="note-detail-grid">

      </label>
      <label class="note-detail-field">건수

    <div class="note-guide">아래에는 점포 특이사항을 적어주세요. 제출하면 관리자 화면에는 인원이름/건수/걸린시간/특이사항이 함께 정리되어 표시됩니다.</div>

    서류제외시 클릭

  <button class="submit-btn" onclick="submitForm()">제출</button>
  <div id="result" class="result"></div>
</div>

<script>
let rememberName=false;
let selected={region:"",brand:"",workType:""};
let noDocumentSelected=false;
function toggleNoDocument(event){
  if(event){ event.preventDefault(); }
  noDocumentSelected=!noDocumentSelected;
  const box=document.getElementById("noDocumentSquare");
  if(box) box.classList.toggle("active", noDocumentSelected);
}

let selectedFiles=[];

const storeHistory={
  "이마트24 강남점":["입점 전 점주 통화 필수","냉장 재고 사진 중요","마스터사장님 매가 기재 요청"],
  "종로창신역점":["오전 9시 입점 요청","점장 통화 후 방문 필요"],
  "수유센트럴점":["양수도 실사 이력 있음","사진 누락 주의"]
};

const pins = {}; // 직원 PIN은 Firebase staffPins에서 확인합니다. // 직원 PIN은 Firebase staffPins에서 확인합니다.

window.addEventListener("load",()=>{
  const savedName=localStorage.getItem("ravebicSavedName");
  if(savedName){
    document.getElementById("name").value=savedName;
    document.getElementById("pinName").value=savedName;
    rememberName=true;
    document.getElementById("rememberSquare").classList.add("active");
  }
  const now=new Date();
  const local=new Date(now.getTime()-now.getTimezoneOffset()*60000);
  document.getElementById("date").value=local.toISOString().slice(0,16);
  setTimeout(updateCorrectionAlertCount, 500);
});

document.getElementById("name").addEventListener("input",function(){
  document.getElementById("pinName").value=this.value;
  if(rememberName){
    localStorage.setItem("ravebicSavedName",this.value.trim());
  }
  clearTimeout(window.ravebicCorrectionAlertTimer);
  window.ravebicCorrectionAlertTimer=setTimeout(updateCorrectionAlertCount, 600);
});

function toggleRemember(){
  rememberName=!rememberName;
  document.getElementById("rememberSquare").classList.toggle("active",rememberName);
  const name=document.getElementById("name").value.trim();
  if(rememberName&&name){localStorage.setItem("ravebicSavedName",name);}
  if(!rememberName){localStorage.removeItem("ravebicSavedName");}
}

function selectOne(group,value,element){
  selected[group]=value;
  let groupId=group==="region"?"regionGroup":group==="brand"?"brandGroup":"workTypeGroup";
  document.getElementById(groupId).querySelectorAll(".round-check").forEach(s=>s.classList.remove("active"));
  element.querySelector(".round-check").classList.add("active");
}

document.getElementById("store").addEventListener("input",function(){
  const value=this.value.trim();
  const box=document.getElementById("historyBox");
  if(storeHistory[value]){
    box.innerHTML="<b>이전 특이사항</b><br>"+storeHistory[value].map(v=>"• "+v).join("<br>");
  }else if(value){
    box.innerHTML="등록된 이전 특이사항이 없습니다. 새 특이사항을 입력하면 누적됩니다.";
  }else{
    box.innerHTML="점포명을 입력하면 이전 특이사항이 표시됩니다.";
  }
});

function escText(v){
  return String(v||"").replace(/[&<>"']/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[s]));
}

function renderFileList(){
  const list=document.getElementById("fileList");
  if(selectedFiles.length===0){
    list.innerHTML="";
    return;
  }
  list.innerHTML=selectedFiles.map((file,idx)=>
    "<div class='file-item'><span>첨부됨: "+escText(file.name)+"</span><button type='button' onclick='removeSelectedFile("+idx+")'>삭제</button></div>"
  ).join("");
}

function addFiles(fileList){
  Array.from(fileList || []).forEach(file=>{
    selectedFiles.push(file);
  });
  renderFileList();
}

function removeSelectedFile(index){
  selectedFiles.splice(index,1);
  renderFileList();
}

document.getElementById("fileInput").addEventListener("change",e=>{addFiles(e.target.files); e.target.value="";});
document.getElementById("cameraInput").addEventListener("change",e=>{addFiles(e.target.files); e.target.value="";});

function openScheduleModal(){document.getElementById("scheduleModal").style.display="flex";}
function closeScheduleModal(){document.getElementById("scheduleModal").style.display="none";}



async function checkPin(){
  const name = document.getElementById("pinName").value.trim();
  const pin = document.getElementById("pin").value.trim();

  if(!name){
    alert("직원 이름을 입력해주세요.");
    return;
  }

  if(!pin){
    alert("PIN 번호를 입력해주세요.");
    return;
  }

  try{
    if(typeof db === "undefined"){
      alert("Firebase 연결이 아직 준비되지 않았습니다. 새로고침 후 다시 시도해주세요.");
      return;
    }

    const staffDoc = await db.collection("staffPins").doc(name).get();

    if(!staffDoc.exists){
      alert("등록되지 않은 직원입니다. 관리자에게 문의하세요.");
      return;
    }

    const staff = staffDoc.data();

    if(staff.active === false){
      alert("비활성화된 직원입니다. 관리자에게 문의하세요.");
      return;
    }

    if(String(staff.pin) !== String(pin)){
      alert("PIN 번호가 맞지 않습니다.");
      return;
    }

    const doc = await db.collection("settings").doc("approvedSchedule").get();

    if(!doc.exists){
      alert("아직 승인된 일정표가 없습니다.");
      return;
    }

    const data = doc.data();
    const scheduleUrl = data.scheduleUrl || data.pdfUrl;

    if(!scheduleUrl){
      alert("승인된 일정표 주소가 없습니다.");
      return;
    }

    window.open(scheduleUrl, "_blank");
    closeScheduleModal();

  }catch(err){
    alert("일정표를 불러오지 못했습니다.\n\n" + err);
  }
}

function getSavedSubmissions(){
  try{return JSON.parse(localStorage.getItem("ravebicSubmissions")||"[]");}
  catch(e){return [];}
}

function saveSubmission(record){
  const all=getSavedSubmissions();
  all.push(record);
  localStorage.setItem("ravebicSubmissions",JSON.stringify(all));
}

function showMySubmissions(){
  const name=document.getElementById("name").value.trim();
  const panel=document.getElementById("myHistoryPanel");
  if(!name){alert("먼저 이름을 입력해주세요.");return;}

  const oneMonthAgo=new Date(Date.now()-30*24*60*60*1000);
  const list=getSavedSubmissions()
    .filter(r=>r.name===name)
    .filter(r=>new Date(r.submittedAt)>=oneMonthAgo)
    .sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt));

  panel.style.display="block";
  if(list.length===0){
    panel.innerHTML="<div class='history-title'>최근 1개월 제출내역</div>해당 이름으로 저장된 제출내역이 없습니다.";
    return;
  }

  panel.innerHTML="<div class='history-title'>최근 1개월 제출내역 ("+list.length+"건)</div>"+
    list.map(r=>"<div class='history-item'><b>"+r.store+"</b><br>제출: "+new Date(r.submittedAt).toLocaleString()+"<br>구분: "+r.region+" / "+r.brand+" / "+r.workType+"<br>특이사항: "+(r.note||"없음")+"</div>").join("");
}

function hideMySubmissions(){
  document.getElementById("myHistoryPanel").style.display="none";
}




async function updateCorrectionAlertCount(){
  const btn=document.getElementById("correctionAlertBtn");
  if(!btn || typeof db === "undefined") return;

  const name=document.getElementById("name").value.trim();
  if(!name){
    btn.classList.remove("correction-alert-active");
    btn.textContent="보완요청함 확인";
    return;
  }

  try{
    const snap=await db.collection("submissions").where("name","==",name).get();
    let count=0;
    snap.forEach(doc=>{
      const d=doc.data() || {};
      if((d.status||"")==="보완요청" && d.correctionResolved !== true){
        count++;
      }
    });

    if(count>0){
      btn.classList.add("correction-alert-active");
      btn.textContent="🔴 보완요청 " + count + "건";
    }else{
      btn.classList.remove("correction-alert-active");
      btn.textContent="보완요청함 확인";
    }
  }catch(e){
    console.log("보완요청 알림 확인 실패", e);
  }
}

async function showCorrectionRequests(){
  const name=document.getElementById("name").value.trim();
  const panel=document.getElementById("correctionPanel");
  if(!name){alert("먼저 이름을 입력해주세요.");return;}

  const isRegisteredStaff = await verifyRegisteredStaffName(name);
  if(!isRegisteredStaff) return;

  panel.style.display="block";
  panel.innerHTML="<div class='history-title'>보완요청함</div>불러오는 중입니다...";

  try{
    const snap = await db.collection("submissions").where("name","==",name).get();
    const rows=[];
    snap.forEach(doc=>{
      const d=doc.data() || {};
      if((d.status||"")==="보완요청" && d.correctionResolved !== true){
        rows.push({id:doc.id,...d});
      }
    });
    rows.sort((a,b)=>new Date(b.correctionRequestedAtText||b.submittedAtText||0)-new Date(a.correctionRequestedAtText||a.submittedAtText||0));

    if(rows.length===0){
      const btn=document.getElementById("correctionAlertBtn");
      if(btn){ btn.classList.remove("correction-alert-active"); btn.textContent="보완요청함 확인"; }
      panel.innerHTML="<div class='history-title'>보완요청함</div>현재 보완요청이 없습니다.";
      return;
    }

    const btn=document.getElementById("correctionAlertBtn");
    if(btn){ btn.classList.add("correction-alert-active"); btn.textContent="🔴 보완요청 "+rows.length+"건"; }

    panel.innerHTML="<div class='history-title'>보완요청함 ("+rows.length+"건)</div>"+
      rows.map(r=>{
        const reqTime = r.correctionRequestedAt && r.correctionRequestedAt.toDate ? r.correctionRequestedAt.toDate().toLocaleString() : (r.correctionRequestedAtText ? new Date(r.correctionRequestedAtText).toLocaleString() : "-");
        return "<div class='correction-item' id='correction_"+escText(r.id)+"'>"+
          "<b>"+escText(r.store||"점포명 없음")+"</b><br>"+
          "요청시간: "+escText(reqTime)+"<br>"+
          "구분: "+escText((r.region||"")+" / "+(r.brand||"")+" / "+(r.workType||""))+"<br>"+
          "<div class='correction-msg'>"+escText(r.correctionMessage||"보완서류가 필요합니다.")+"</div>"+
          "<div class='correction-upload'>"+
          "<input id='correctionFile_"+escText(r.id)+"' type='file' multiple>"+
          "<button type='button' onclick=\"submitCorrectionFiles('"+escText(r.id)+"')\">보완서류 제출</button>"+
          "</div>"+
          "</div>";
      }).join("");

    for(const r of rows){
      if(r.correctionRead !== true){
        db.collection("submissions").doc(r.id).update({correctionRead:true}).catch(()=>{});
      }
    }
  }catch(err){
    panel.innerHTML="<div class='history-title'>보완요청함</div>불러오기 실패: "+escText(err.message || err);
  }
}

async function submitCorrectionFiles(docId){
  const input=document.getElementById("correctionFile_"+docId);
  if(!input || !input.files || input.files.length===0){
    alert("보완으로 제출할 파일을 선택해주세요.");
    return;
  }
  const box=document.getElementById("correction_"+docId);
  const files=Array.from(input.files);
  if(box){ box.insertAdjacentHTML('beforeend', "<div class='correction-msg'>보완서류 업로드 중입니다...</div>"); }

  try{
    const uploaded=[];
    for(let i=0;i<files.length;i++){
      const file=files[i];
      const path="submissions/"+docId+"/corrections/"+Date.now()+"_"+String(i+1).padStart(2,"0")+"_"+safeFileName(file.name);
      const ref=storage.ref().child(path);
      await ref.put(file);
      const url=await ref.getDownloadURL();
      uploaded.push({name:file.name,size:file.size,type:file.type||"",path:path,url:url,uploadedAt:new Date().toISOString()});
    }

    const docRef=db.collection("submissions").doc(docId);
    await docRef.update({
      correctionFiles: firebase.firestore.FieldValue.arrayUnion(...uploaded),
      files: firebase.firestore.FieldValue.arrayUnion(...uploaded),
      status:"미확인",
      correctionSubmittedAt: firebase.firestore.FieldValue.serverTimestamp(),
      correctionSubmittedAtText: new Date().toISOString(),
      correctionResolved:false,
      statusUpdatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("보완서류 제출이 완료되었습니다.");
    showCorrectionRequests();
    setTimeout(updateCorrectionAlertCount, 700);
  }catch(err){
    alert("보완서류 제출 실패:\n\n"+(err.message || err));
  }
}

function hideCorrectionRequests(){
  document.getElementById("correctionPanel").style.display="none";
}

async function verifyRegisteredStaffName(name){
  if(typeof db === "undefined"){
    alert("Firebase 연결이 아직 준비되지 않았습니다. 새로고침 후 다시 시도해주세요.");
    return false;
  }

  const staffDoc = await db.collection("staffPins").doc(name).get();

  if(!staffDoc.exists){
    alert("관리자에 등록되지 않은 직원명입니다.\n\n직원명을 확인하거나 관리자에게 등록 요청하세요.");
    return false;
  }

  const staff = staffDoc.data();

  if(staff.active === false){
    alert("비활성화된 직원명입니다. 관리자에게 문의하세요.");
    return false;
  }

  return true;
}

function safeFileName(name){
  return String(name || "file").replace(/[\\/:*?"<>|#%&{}$!'`@+=]/g,"_").replace(/\s+/g,"_");
}

async function uploadSelectedFiles(docId){
  const uploaded=[];
  for(let i=0;i<selectedFiles.length;i++){
    const file=selectedFiles[i];
    const path="submissions/"+docId+"/"+String(i+1).padStart(2,"0")+"_"+safeFileName(file.name);
    const ref=storage.ref().child(path);
    await ref.put(file);
    const url=await ref.getDownloadURL();
    uploaded.push({
      name:file.name,
      size:file.size,
      type:file.type || "",
      path:path,
      url:url
    });
  }
  return uploaded;
}

async function submitForm(){
  const name=document.getElementById("name").value.trim();
  const date=document.getElementById("date").value;
  const store=document.getElementById("store").value.trim();
  const workerNames=document.getElementById("workerNames").value.trim();
  const workCount=document.getElementById("workCount").value.trim();
  const workDuration=document.getElementById("workDuration").value.trim();
  const noteDetail=document.getElementById("note").value.trim();
  const note="인원이름: "+(workerNames||"-")+"\n건수: "+(workCount?workCount+"건":"-")+"\n걸린시간: "+(workDuration||"-")+"\n특이사항기재: "+(noteDetail||"-");

  if(!name)return alert("이름을 입력해주세요.");

  const isRegisteredStaff = await verifyRegisteredStaffName(name);
  if(!isRegisteredStaff) return;
  if(!date)return alert("날짜를 입력해주세요.");
  if(!store)return alert("점포명을 입력해주세요.");
  if(!workerNames)return alert("인원이름을 입력해주세요.");
  if(!workCount)return alert("건수를 입력해주세요.");
  if(!workDuration)return alert("걸린시간을 입력해주세요.");
  if(!selected.region)return alert("지역을 선택해주세요.");
  if(!selected.brand)return alert("브랜드를 선택해주세요.");
  if(!selected.workType)return alert("업무유형을 선택해주세요.");
  if(selectedFiles.length === 0 && !noDocumentSelected){
    return alert("첨부파일이 없으면 서류제외시 클릭을 체크해야 제출할 수 있습니다.");
  }

  const result=document.getElementById("result");
  result.style.display="block";
  result.innerHTML="<b>제출 중입니다...</b><br>첨부파일을 서버에 업로드하고 있습니다.";

  try{
    const docRef = db.collection("submissions").doc();
    const uploadedFiles = await uploadSelectedFiles(docRef.id);

    const record={
      name,date,store,note,
      workerNames: workerNames,
      workCount: workCount,
      workDuration: workDuration,
      noteDetail: noteDetail,
      noDocument: noDocumentSelected,
      region:selected.region,
      brand:selected.brand,
      workType:selected.workType,
      files: uploadedFiles,
      noDocument: noDocumentSelected,
      status:"미확인",
      submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
      submittedAtText: new Date().toISOString()
    };

    await docRef.set(record);

    saveSubmission({
      name,date,store,note,
      workerNames: workerNames,
      workCount: workCount,
      workDuration: workDuration,
      noteDetail: noteDetail,
      noDocument: noDocumentSelected,
      region:selected.region,
      brand:selected.brand,
      workType:selected.workType,
      files: uploadedFiles.map(f=>({name:f.name,url:f.url})),
      submittedAt:new Date().toISOString()
    });

    result.innerHTML="<b>제출 완료</b><br>직원명: "+escText(name)+"<br>날짜: "+escText(date)+"<br>점포명: "+escText(store)+"<br>지역: "+escText(selected.region)+"<br>브랜드: "+escText(selected.brand)+"<br>업무유형: "+escText(selected.workType)+"<br>인원이름: "+escText(workerNames)+"<br>건수: "+escText(workCount)+"건<br>걸린시간: "+escText(workDuration)+"<br>특이사항: "+escText(noteDetail||"없음")+"<br>첨부파일: "+uploadedFiles.length+"개<br>서버 제출시간: "+new Date().toLocaleString();

    document.getElementById("workerNames").value="";
    document.getElementById("workCount").value="";
    document.getElementById("workDuration").value="";
    document.getElementById("note").value="";
    selectedFiles=[];
    renderFileList();
  }catch(err){
    console.error(err);
    result.innerHTML="<b>제출 실패</b><br>Firebase 저장 또는 파일 업로드에 실패했습니다.<br>"+escText(err.message || err);
    alert("제출 실패:\n\n" + (err.message || err));
  }
}
